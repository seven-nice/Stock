name: Audit TWSE TPEx quote schemas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect dates codes and column names
        run: python scripts/quote_schema_audit.py
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-schema-audit
          path: results/quote_schema_audit.json
          if-no-files-found: warn
          retention-days: 30
