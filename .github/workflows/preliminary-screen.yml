name: Daily preliminary stock screening
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1-5'
permissions:
  contents: read
jobs:
  preliminary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare two official market trading sessions
        run: python scripts/preliminary_screen.py
      - name: Keep audit and candidate outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preliminary-stock-candidates
          path: results/preliminary_*.json
          if-no-files-found: warn
          retention-days: 30
